name: Validate

# The predecessor repository had a validation workflow that pointed at a file
# which did not exist, in a repository that was not the one being published,
# and it had no run history at all. This one runs on its own file, on every
# push and pull request, and its run history is the evidence that it works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Specification and grounding checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check specification, overlays and grounding gate
        run: python scripts/check.py

      - name: Resolve overlays and upload the published document
        run: |
          python scripts/apply_overlay.py openapi.yaml overlays/*.yaml \
            -o build/openapi.resolved.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: resolved-specification
          path: build/openapi.resolved.yaml

  shape:
    name: Fidelity to the base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch the pinned base specification
        run: ./scripts/fetch-base.sh

      - name: Every surviving operation still matches the base
        # Removals are fine and expected; they just have to be written down in
        # _project/base-delta.yaml. A reshaped operation is not fine: structure
        # was inherited, not authored, so an edit here means somebody changed
        # the API in a documentation repository.
        run: python scripts/check_shape.py --require-base

  lint:
    name: Spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint against the baseline
        # Inherited debt is allowed to stay; it is not allowed to grow.
        run: python scripts/lint.py --json build/spectral.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-findings
          path: build/spectral.json

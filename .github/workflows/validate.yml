name: Validate

# The predecessor repository had a validation workflow that pointed at a file
# which did not exist, in a repository that was not the one being published,
# and it had no run history at all. This one runs on its own file, on every
# push and pull request, and its run history is the evidence that it works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Specification and grounding checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check specification, overlays and grounding gate
        run: python scripts/check.py

      - name: Resolve overlays and upload the published document
        run: |
          python scripts/apply_overlay.py openapi.yaml overlays/*.yaml \
            -o build/openapi.resolved.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: resolved-specification
          path: build/openapi.resolved.yaml

  build:
    name: Derived artifacts are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: openapi.yaml reflects the decision files
        # Until the end of Phase 1 this job compared openapi.yaml against the
        # inherited base. That comparison is retired: the base is no longer
        # fetched and openapi.yaml is the source of truth for structure.
        #
        # What replaces it is the same idea aimed at the files that still
        # decide things. The base URLs live in _project/servers.yaml, the plane
        # split in _project/planes.yaml, the tag architecture in tags-map.yaml,
        # and what is not shipped in _project/drops.yaml. Editing one of those
        # and not rebuilding leaves a document that disagrees with its own
        # configuration -- and the disagreement is invisible, because both
        # files look right on their own.
        run: python scripts/build.py --check

  lint:
    name: Spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint against the baseline
        # Inherited debt is allowed to stay; it is not allowed to grow.
        run: python scripts/lint.py --json build/spectral.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectral-findings
          path: build/spectral.json

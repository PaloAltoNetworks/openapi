# The base URLs. This is the one place to change them.
#
# `scripts/build.py` deletes every inherited `servers` block in the base -- 97
# path-level and 2 operation-level -- and writes these instead. Edit a host
# here and every operation in openapi.yaml follows on the next build. Nothing
# below needs touching, and there is no second copy to forget.
#
# Literal URLs, not server variables. Variables were tried first, because a
# `{host}` variable with a `default` is the mechanism OpenAPI provides for
# exactly this and it would have let a self-hosted reader substitute their own
# address. Mintlify cannot resolve them: with a templated `url` it renders
# "A valid request URL is required to generate request examples" and emits no
# cURL sample at all, on every operation. Verified locally against
# mint 4.2.893 -- swap these for `{host}` and the samples disappear.
#
# The cost is that self-hosting is no longer offered as a substitutable value.
# That was already true in practice: the base "offered" it as the literal
# string SELF_HOSTED_GATEWAY_URL, which was never a working address. Where to
# point a self-hosted deployment is documentation, and belongs in prose.

# Data plane. The root server, so the 52 gateway paths need no override.
gateway:
  url: https://aigw.portkey.ai/v1

# Management plane. Stamped onto the 66 paths that _project/planes.yaml marks
# control-plane, because OpenAPI has no way for a path to point back at a
# server declared once at the root.
#
# The two planes do not share a prefix -- gateway is /v1, control plane is
# /api/v1. Paths are declared bare (`/api-keys`, not `/api/v1/api-keys`), so
# the prefix lives entirely here.
control-plane:
  url: https://mp.us.prod.airs-gw.portkey.ai/api/v1

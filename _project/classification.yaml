# Human decisions about which plane a path belongs to.
#
# The default classification was read off the base author's per-path `servers`
# overrides -- Portkey's opinion, inherited and unverified. Anything decided
# here overrode it, and `planes.yaml` still cites this file by name in the
# `how:` field of every path it decided, so which calls a person made stays
# visible.
#
# Patterns are fnmatch-style. Note that `*` crosses slashes: /models* matches
# /models/{model} as well as /models, which is exactly the trap below. Two rules
# guard this file, both confirmed to fire:
#
#   - a pattern matching no path is an error, so a rename cannot silently
#     deactivate a rule
#   - a path claimed by both planes is an error, rather than resolved by order
#
# **Historical as of Phase 2.** This file records one round of classification
# into two planes, and nothing reads it -- the rules above ran once, against the
# base, and their result is in `_project/planes.yaml`, which is what the build
# reads. Phase 2 split the management side into `control-plane`, `admin` and
# `admin-in-path`, so three entries below are now finer-grained in planes.yaml
# than they are here: `/integrations/{slug}/models` and
# `/integrations/{slug}/workspaces` are on the admin plane, and `/guardrails*`
# covers a control-plane surface and an admin one that did not exist when this
# was written. They are left as they were rather than edited, because the value
# of this file is the reasoning at the time; planes.yaml is the current answer.

control-plane:
  # Vrushank, 2026-09-15. CRUD over a configuration resource. The base never
  # classified these because it gave them no server override, not because it
  # thought they were data plane.
  - /guardrails*

  # Vrushank, 2026-09-15.
  - /policies/*                      # rate-limit and usage-limit policies
  - /integrations/{slug}/models
  - /integrations/{slug}/workspaces
  - /model-configs/*                 # model pricing

  # Deliberately not /models*, which would also claim /models below. The two
  # paths sit on opposite sides of the split: listing the models available to
  # a caller is a gateway concern, administering one is not.
  - /models/{model}

gateway:
  # Vrushank, 2026-09-15. Already classified as gateway by the inherited data;
  # recorded anyway so the boundary with /models/{model} is explicit and a
  # later /models* rule fails loudly instead of quietly moving it.
  - /models

  # Vrushank, 2026-09-15.
  - /vector_stores*

# What is deliberately not shipped in the Prisma AIRS specification --
# whole capabilities, individual operations, and individual parameters.
#
# Read by scripts/build.py. A routine build only checks this file: if
# anything named here is still in openapi.yaml the build fails, which is the
# guard against a dropped endpoint being pasted back in. To actually remove
# something, add it here and run `python scripts/build.py --apply-drops`
# once, then commit this file and openapi.yaml together -- the deletion is
# meant to be visible in the diff, not to happen quietly on every build.
#
# Capabilities are selected by tag, not by path. That is how the decision is
# actually made -- whole capabilities go, not individual URLs -- and it
# survives a path rename, which a path list would not.

# Vrushank, 2026-09-15, marked [DROPPED] in drop-list.md.
#
# Control-plane capabilities that Prisma AIRS does not expose. Ten of the
# eleven are control plane throughout. `Prompts` is the exception: it spans
# both planes, and dropping only the control-plane side would ship an API
# where a prompt can be executed but never created, listed or versioned, so
# the two gateway paths under it go as well.
tags:
  - Audit Logs
  - Collections
  # Deployments was here until Phase 2. Vrushank, 2026-09-15: it is exposed
  # after all, on the admin plane, so the six operations were recovered from
  # the pre-drop revision (d9d380b) and put back. What came back is the
  # inherited Portkey shape -- nothing has checked it against the API now
  # serving /ai_gw/admin/v2/deployments.
  - Labels
  - Log Exports
  - Prompt Partials
  - Prompts                 # spans both planes; the gateway paths go too
  - User Invites
  - Users
  - Virtual Keys
  - Workspaces > Members

# Engineering, 2026-09-15. Their list named seven capabilities as dropped;
# six were already gone above. `Workspaces` is the one that was still
# shipping. Their list also named "SCIM Workspace Mappings" separately, but
# the base did not tag it separately: /scim/workspaces{,/{id}} carries the
# `Workspaces` tag too, so this one line removes both surfaces -- five
# /admin/workspaces operations and three /scim/workspaces ones.
  - Workspaces

# Individual operations to drop where the whole tag stays. Empty today: every
# current removal is a clean tag boundary. Entries are "METHOD /path".
operations: []

# Parameter names that must not appear on any operation, matched on `name`
# regardless of which operation or which `in` location carries it. A name
# rather than a list of sites, because the objection is to the parameter
# itself: listing sites would let it reappear on a new operation.
#
# Engineering, 2026-09-15: organisation_id is not needed as a parameter
# anywhere. It was a query parameter on GET /guardrails and
# GET /mcp-integrations. Scoped to *parameters* -- `organisation_id` remains a
# property on response schemas, which is a separate question nobody has asked.
parameters:
  - organisation_id

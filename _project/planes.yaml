# Which plane every path belongs to. Generated once, then maintained by hand.
#
# Until now this lived implicitly in the base's per-path `servers` overrides.
# Task 2 deletes those, so the signal had to be written down before it was
# destroyed -- otherwise the split would have become unreproducible the moment
# the overrides went.
#
# `scripts/build.py` reads this to decide which paths need a control-plane
# server override. Every path in openapi.yaml must appear here or the build
# fails: a path added without a plane would silently inherit the gateway URL.
#
# `how` records where the call came from:
#   classification.yaml  -- a human decided, see that file for the reasoning
#   inherited            -- read off the base's server override, unverified
#
# The gateway is the root server, so gateway paths carry no override.


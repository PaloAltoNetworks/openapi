# Which plane every path belongs to. Generated once, then maintained by hand.
#
# Until now this lived implicitly in the base's per-path `servers` overrides.
# Task 2 deletes those, so the signal had to be written down before it was
# destroyed -- otherwise the split would have become unreproducible the moment
# the overrides went.
#
# `scripts/build.py` reads this to decide which server block each path needs.
# Every path in openapi.yaml must appear here or the build fails: a path added
# without a plane would silently inherit the gateway URL.
#
# The keys are plane names and each one must exist in _project/servers.yaml,
# which holds the URLs. Four planes:
#
#   gateway         the data plane; the root server, so no override is written
#   control-plane   /ai_gw/v2
#   admin           /ai_gw/admin/v2
#   admin-in-path   also /ai_gw/admin/v2, but the prefix is in the path key
#                   rather than the server URL -- see servers.yaml for why
#
# `how` records where the call came from:
#   classification.yaml  -- a human decided, see that file for the reasoning
#   inherited            -- read off the base's server override, unverified
#   vrushank.2026-09-15  -- the Phase 2 admin split, decided by capability
#                           (Integrations, MCP Integrations, Secret References,
#                           Org Guardrails, Deployments) and written out here
#                           as the paths those capabilities cover

# Tags whose operations are deliberately not all on one plane. `check.py` fails
# on any other tag that spans two, because the split was decided by capability
# and a tag is what carries one -- a single path drifting onto another host
# otherwise reads as intentional.
tags-spanning-planes:
  # Vrushank, 2026-09-15, in classification.yaml: listing the models available
  # to a caller is a gateway concern (/models) and administering one is not
  # (/models/{model}). One tag, two planes, on purpose.
  - Models

control-plane:
  "/analytics/graphs/cache/hit-rate": inherited
  "/analytics/graphs/cache/latency": inherited
  "/analytics/graphs/cost": inherited
  "/analytics/graphs/errors": inherited
  "/analytics/graphs/errors/rate": inherited
  "/analytics/graphs/errors/stacks": inherited
  "/analytics/graphs/errors/status-codes": inherited
  "/analytics/graphs/feedbacks": inherited
  "/analytics/graphs/feedbacks/ai-models": inherited
  "/analytics/graphs/feedbacks/scores": inherited
  "/analytics/graphs/feedbacks/weighted": inherited
  "/analytics/graphs/latency": inherited
  "/analytics/graphs/requests": inherited
  "/analytics/graphs/requests/rescued": inherited
  "/analytics/graphs/tokens": inherited
  "/analytics/graphs/users": inherited
  "/analytics/graphs/users/requests": inherited
  "/analytics/groups/ai-models": inherited
  "/analytics/groups/metadata/{metadataKey}": inherited
  "/analytics/groups/provider": inherited
  "/analytics/groups/users": inherited
  "/analytics/summary/cache": inherited
  "/api-keys": inherited
  "/api-keys/{id}": inherited
  "/api-keys/{id}/rotate": inherited
  "/api-keys/{sub-type}": inherited
  "/configs": inherited
  "/configs/{slug}": inherited
  "/configs/{slug}/versions": inherited
  "/feedback": inherited
  "/feedback/{id}": inherited
  "/guardrails": classification.yaml
  "/guardrails/{guardrailId}": classification.yaml
  "/guardrails/{guardrailId}/mcp-servers": classification.yaml
  "/guardrails/{guardrailId}/mcp-servers/{mcpServerId}": classification.yaml
  "/mcp-servers": inherited
  "/mcp-servers/{mcpServerId}": inherited
  "/mcp-servers/{mcpServerId}/capabilities": inherited
  "/mcp-servers/{mcpServerId}/connections": inherited
  "/mcp-servers/{mcpServerId}/test": inherited
  "/mcp-servers/{mcpServerId}/user-access": inherited
  "/model-configs/pricing/{provider}/{model}": classification.yaml
  "/models/{model}": classification.yaml
  "/policies/rate-limits": classification.yaml
  "/policies/rate-limits/{rateLimitsPolicyId}": classification.yaml
  "/policies/usage-limits": classification.yaml
  "/policies/usage-limits/{policyUsageLimitsId}": classification.yaml
  "/policies/usage-limits/{policyUsageLimitsId}/entities": classification.yaml
  "/policies/usage-limits/{policyUsageLimitsId}/entities/{entityId}/reset": classification.yaml

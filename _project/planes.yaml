# Administered on /ai_gw/admin/v2. Selected by capability, not by URL: the call
# was "Integrations, MCP Integrations, Secret References, Deployments and Org
# Guardrails are admin", and these are the paths those capabilities cover. A new
# path under one of them belongs here too, and `check.py` says so if the tag it
# carries is administered elsewhere.
admin:
  "/integrations": vrushank.2026-09-15
  "/integrations/{slug}": vrushank.2026-09-15
  "/integrations/{slug}/models": vrushank.2026-09-15
  "/integrations/{slug}/workspaces": vrushank.2026-09-15
  "/mcp-integrations": vrushank.2026-09-15
  "/mcp-integrations/{mcpIntegrationId}": vrushank.2026-09-15
  "/mcp-integrations/{mcpIntegrationId}/capabilities": vrushank.2026-09-15
  "/mcp-integrations/{mcpIntegrationId}/metadata": vrushank.2026-09-15
  "/mcp-integrations/{mcpIntegrationId}/workspaces": vrushank.2026-09-15
  "/secret-references": vrushank.2026-09-15
  "/secret-references/{secretReferenceId}": vrushank.2026-09-15

  # Recovered in Phase 2, having been dropped in Phase 1 as a capability Prisma
  # AIRS does not expose. The shape here is the inherited Portkey one and has
  # not been checked against the admin API that now serves it.
  "/deployments": vrushank.2026-09-15
  "/deployments/{deploymentId}": vrushank.2026-09-15
  "/deployments/{deploymentId}/ping": vrushank.2026-09-15

# The org-level guardrails, which the API serves at the same suffix as the
# control-plane ones. The `/admin/v2` in these keys is the server prefix, moved
# here because a document cannot hold two paths spelled `/guardrails`.
admin-in-path:
  "/admin/v2/guardrails": vrushank.2026-09-15
  "/admin/v2/guardrails/{guardrailId}": vrushank.2026-09-15
  "/admin/v2/guardrails/{guardrailId}/mcp-servers": vrushank.2026-09-15
  "/admin/v2/guardrails/{guardrailId}/mcp-servers/{mcpServerId}": vrushank.2026-09-15


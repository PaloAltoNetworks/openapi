# Tag information architecture for the Prisma AIRS AI Gateway API.
#
# Tag names are simultaneously navigation display text and reference keys that
# operations point at. This file is the single place where that rename is
# decided, so the mapping stays reviewable instead of being spread across 242
# operations. `scripts/build.py` applies it; `scripts/check.py` enforces that
# every tag an operation names is declared here.
#
# Naming conventions applied:
#   - Title Case, spaces as the word separator (not hyphens, not camelCase)
#   - Plural for tags that group operations over a collection of resources
#   - "Parent > Child" retained for genuine sub-resources; Mintlify maps the
#     nesting onto navigation groups
#   - Initialisms uppercased (API, MCP, OCR)
#
# `group` assigns the tag to a top-level navigation group. `description` is
# deliberately absent everywhere: tag prose is published documentation and is
# authored in overlays/docs-prose.yaml under the grounding gate.

groups:
  - id: inference
    title: Inference
  - id: gateway-config
    title: Gateway Configuration
  - id: providers
    title: Providers and Credentials
  - id: mcp
    title: MCP
  - id: administration
    title: Administration
  - id: observability
    title: Observability

# from: tag name as it appears in the inherited Portkey specification
# to:   tag name in this specification
tags:
  # --- Inference -------------------------------------------------------
  - from: Chat
    to: Chat
    group: inference
  - from: Completions
    to: Completions
    group: inference

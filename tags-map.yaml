# Tag information architecture for the Prisma AIRS AI Gateway API.
#
# Tag names are simultaneously navigation display text and reference keys that
# operations point at. This file is the single place where the naming and the
# navigation grouping are decided, so both stay reviewable instead of being
# spread across 181 operations. `scripts/build.py` orders the spec's `tags`
# block and generates docs-navigation.json from it; `scripts/check.py` enforces
# that every tag an operation names is declared here.
#
# `from` is the name the inherited Portkey specification used. The rename it
# describes happened once and is done -- nothing reads `from` any more. It is
# kept because it is the only record of where a tag name came from, and two
# entries mapping to one `to` is how a merge is documented.
#
# Only shipped tags are listed. The eleven groups dropped in Phase 1 were
# removed from this file when the base linkage was retired; the record of what
# is not shipped, and why, is `_project/drops.yaml`.
#
# Naming conventions applied:
#   - Title Case, spaces as the word separator (not hyphens, not camelCase)
#   - Plural for tags that group operations over a collection of resources
#   - "Parent > Child" retained for genuine sub-resources; Mintlify maps the
#     nesting onto navigation groups
#   - Initialisms uppercased (API, MCP, OCR)
#
# `group` assigns the tag to a top-level navigation group. `description` is
# deliberately absent everywhere: tag prose is published documentation and is
# authored in overlays/docs-prose.yaml under the grounding gate.

groups:
  - id: inference
    title: Inference
  - id: gateway-config
    title: Gateway Configuration
  - id: providers
    title: Providers and Credentials
  - id: mcp
    title: MCP
  - id: administration
    title: Administration
  - id: observability
    title: Observability

# from: tag name as it appears in the inherited Portkey specification
# to:   tag name in this specification
